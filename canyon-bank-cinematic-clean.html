<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canyon Bank</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.top{height:5px;background:#24527a}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:430px;background:#fff;border-radius:18px;box-shadow:0 12px 40px #00000018;overflow:hidden}
.header{padding:30px 32px 18px;border-bottom:1px solid #edf0f2}.brand{font-size:27px;font-weight:750;color:#24527a;letter-spacing:-.5px}.tag{font-size:13px;color:#77818a;margin-top:4px}
.content{padding:26px 32px 30px}label{display:block;font-size:13px;font-weight:650;margin:17px 0 7px}input{width:100%;height:48px;border:1px solid #cdd4da;border-radius:8px;padding:0 13px;font-size:16px;outline:none}input:focus{border-color:#24527a;box-shadow:0 0 0 3px #24527a18}
button{width:100%;height:48px;margin-top:23px;border:0;border-radius:8px;background:#24527a;color:white;font-size:15px;font-weight:700;cursor:pointer}.links{text-align:center;margin-top:17px;font-size:13px;color:#24527a}
.notice{font-size:10px;text-align:center;color:#8a9299;margin-top:24px}.hidden{display:none}
.dashboard{padding:26px 28px 30px}.welcome{font-size:14px;color:#707a83}.name{font-size:25px;font-weight:750;margin-top:2px}.balance{margin-top:23px;padding:23px;border-radius:13px;background:#f1f6fa}.balance span{font-size:12px;color:#6f7a83}.amount{font-size:32px;font-weight:750;margin-top:5px}.acct{font-size:12px;color:#77818a;margin-top:7px}
h3{font-size:16px;margin:27px 0 8px}.row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf0f2;font-size:14px}.row small{display:block;color:#818a91;margin-top:3px}.debit{font-weight:650}.credit{font-weight:650}.logout{margin-top:22px}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap"><div class="card">
<div class="header"><div class="brand">Canyon Bank</div><div class="tag">Personal Online Banking</div></div>

<div id="login" class="content">
<label>Username</label>
<input id="username" value="kaylawoods" autocomplete="off">
<label>Password</label>
<input id="password" value="Kaylawoodslove1" type="password" autocomplete="off">
<button onclick="signIn()">Sign In</button>
<div id="msg" class="links"></div>

</div>

<div id="dashboard" class="dashboard hidden">
<div class="welcome">Good morning</div><div class="name">Kayla Woods</div>
<div class="balance"><span>Available balance</span><div class="amount">$12,450.75</div><div class="acct">Checking •••• 4821</div></div>
<h3>Recent activity</h3>
<div class="row"><div>Online Purchase<small>Sep 16, 2026</small></div><div class="debit">−$84.20</div></div>
<div class="row"><div>Direct Deposit<small>Sep 15, 2026</small></div><div class="credit">+$2,500.00</div></div>
<div class="row"><div>Coffee Shop<small>Sep 14, 2026</small></div><div class="debit">−$6.50</div></div>
<button class="logout" onclick="logOut()">Sign Out</button>

</div>
</div></div>
<script>
function signIn(){let u=document.getElementById('username').value,p=document.getElementById('password').value;if(u==='kaylawoods'&&p==='Kaylawoodslove1'){document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden')}else{document.getElementById('msg').textContent='The username or password is incorrect.'}}
function logOut(){document.getElementById('dashboard').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
</script>
</body>
</html>
